<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' file: data:; img-src 'self' file: https: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Markdoc</title>
</head>
<body>
  <header id="toolbar" aria-label="문서 서식 도구 모음">
    <button data-action="explorer" data-icon="folder" aria-label="파일 탐색기 열기/닫기" title="파일 탐색기 열기/닫기"></button>
    <button class="dropdown-button" data-menu="0" data-icon="save" aria-label="저장" title="저장" aria-haspopup="menu"></button>
    <button class="dropdown-button" data-menu="2" data-icon="settings" aria-label="설정" title="설정" aria-haspopup="menu"></button>
    <button data-action="undo" data-icon="undo" aria-label="되돌리기" title="되돌리기"></button>
    <button data-action="redo" data-icon="redo" aria-label="다시 실행" title="다시 실행"></button>
    <span class="separator"></span>
    <label class="heading-select"><select id="heading" aria-label="헤더"><option value="paragraph">본문</option><option value="h1">H1</option><option value="h2">H2</option><option value="h3">H3</option><option value="h4">H4</option><option value="h5">H5</option><option value="h6">H6</option></select></label>
    <button data-action="bold" title="볼드 Ctrl+B"><b>B</b></button><button data-action="italic" title="이탤릭 Ctrl+I"><i>I</i></button><button data-action="underline" title="밑줄 Ctrl+U"><u>U</u></button><button data-action="strike" title="취소선"><s>S</s></button>
    <button data-action="table" data-icon="table" aria-label="표 삽입" title="표 삽입"></button>
    <button data-action="math" data-icon="equation" aria-label="수식 입력기" title="수식 입력기"></button>
    <span id="table-tools" hidden><button data-action="addRowAfter">행 추가</button><button data-action="addColumnAfter">열 추가</button><button data-action="deleteRow">행 삭제</button><button data-action="deleteColumn">열 삭제</button><button data-action="deleteTable">표 삭제</button></span>
    <label class="icon-select" data-icon="codeblock" title="코드"><select id="code-style" aria-label="코드"><option value="" hidden>코드</option><option value="codeblock">코드 블록</option><option value="code">인라인 코드</option></select></label>
    <button data-action="image" data-icon="image" aria-label="이미지 삽입" title="이미지 삽입"></button>
    <button data-action="bulletList" data-icon="bulletlist" aria-label="불릿" title="불릿"></button>
    <button data-action="orderedList" data-icon="numberedlist" aria-label="번호 목록" title="번호 목록"></button>
    <button data-action="taskList" data-icon="checkbox" aria-label="체크 목록" title="체크 목록"></button>
    <button data-action="blockquote" data-icon="quote" aria-label="인용" title="인용"></button>
    <button data-action="horizontalRule" data-icon="horizontalrule" aria-label="구분선" title="구분선"></button>
    <button data-action="link" data-icon="link" aria-label="링크" title="링크"></button>
    <label class="icon-select" data-icon="paper" title="용지"><select id="paper" aria-label="용지"><option>A4</option><option>Letter</option><option value="none">용지 없음</option></select></label>
    <button data-action="typography" data-icon="font" aria-label="글자 크기·행간" title="글자 크기·행간"></button>
  </header>
  <main id="workspace">
    <aside id="explorer" aria-label="파일 탐색기">
      <div class="explorer-actions"><button id="choose-folder">폴더 열기</button><button id="refresh-files">새로고침</button></div>
      <div id="folder-name"></div><div id="file-tree" role="tree"></div>
    </aside>
    <section id="document-viewport" aria-label="페이지 문서 편집창">
      <div id="page-stack"><div id="page-sheets" aria-hidden="true"></div><div id="document-surface"><div id="editor"></div></div><div id="page-masks" aria-hidden="true"></div></div>
    </section>
  </main>
  <footer><span id="status" role="status">준비</span><span id="statistics" aria-live="polite">글자 0 (공백 포함) · 단어 0 · 1쪽</span></footer>
  <dialog id="typography-dialog"><form method="dialog"><h2>글자 크기 및 행간</h2><div id="typography-fields"></div><p>글자 크기는 pt 단위입니다. 문서 전체와 인쇄에 함께 적용합니다.</p><div class="dialog-actions"><button value="cancel" formnovalidate>취소</button><button value="apply">적용</button></div></form></dialog>
  <dialog id="table-dialog"><form method="dialog"><h2>표 삽입</h2><label>행 <input id="table-rows" type="number" value="3" min="1" max="50" required></label><label>열 <input id="table-cols" type="number" value="3" min="1" max="12" required></label><div class="dialog-actions"><button value="cancel" formnovalidate>취소</button><button value="insert">삽입</button></div></form></dialog>
  <dialog id="image-dialog"><form method="dialog"><h2>이미지 삽입</h2><button value="absolute" formnovalidate>절대경로로 파일 선택…</button><p>또는 문서 위치를 기준으로 상대경로를 입력하세요.</p><label for="image-relative">상대경로</label><input id="image-relative" type="text" placeholder="./images/photo.png" required><p>상대경로를 사용하려면 먼저 문서를 저장하세요. 입력한 경로는 저장 시 유지됩니다.</p><div class="dialog-actions"><button value="cancel" formnovalidate>취소</button><button value="relative">상대경로로 삽입</button></div></form></dialog>
  <dialog id="link-dialog"><form method="dialog"><h2>링크</h2><label>주소 <input id="link-url" type="url" placeholder="https://example.com" required></label><div class="dialog-actions"><button value="cancel" formnovalidate>취소</button><button value="insert">적용</button></div></form></dialog>
  <script type="module" src="/src/renderer.js"></script>
  <dialog id="math-dialog" aria-labelledby="math-title"><form method="dialog">
    <h2 id="math-title">수식 입력기</h2>
    <div class="math-history"><button id="math-undo" type="button" title="Ctrl+Z">되돌리기</button><button id="math-redo" type="button" title="Ctrl+Y">다시 실행</button></div>
    <div id="math-elements"></div>
    <label>미리보기</label><div id="math-preview" aria-live="polite"></div>
    <label for="math-tex">TeX 구문</label><textarea id="math-tex" rows="4" spellcheck="false"></textarea>
    <label class="math-mode"><input id="math-display" type="checkbox" checked> <span>독립 수식</span></label>
    <p id="math-error" role="status"></p><p>수식을 클릭하면 직접 편집할 수 있습니다.</p>
    <div class="dialog-actions"><button value="cancel" formnovalidate>취소</button><button id="math-insert" value="insert">입력</button></div>
  </form></dialog>
</body>
</html>
